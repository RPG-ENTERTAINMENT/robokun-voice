name: voice
on:
  push:
    paths: ['jobs/**', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: voice
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: bash scripts/run.sh
      - if: always()
        run: bash scripts/save.sh
